<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer Probe</title>
<style>
body{font:14px/1.45 system-ui,sans-serif;margin:0;padding:12px;color:#1c2330;background:#fff}
@media (prefers-color-scheme:dark){body{background:#161b22;color:#e6edf3}pre{background:#0d1117!important}}
h1{font-size:16px;margin:0 0 6px}button{font:inherit;padding:6px 10px;margin:4px 6px 4px 0;border-radius:6px;border:1px solid #8884;cursor:pointer}
pre{background:#f3f5f8;padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow:auto}
.ok{color:#1a7f37}.bad{color:#c62828}
</style></head><body>
<h1>Viewer Probe</h1>
<div id="st">Connecting to Trimble Connect…</div>
<div>
<button id="b1" disabled>1. Read selected objects</button>
<button id="b2" disabled>2. Read ALL objects</button>
<button id="b3" disabled>Save results (JSON)</button>
</div>
<pre id="out">Select a few objects in the 3D view (for example a beam, a plate, a bolt), then press button 1.</pre>
<script>
var api=null,last=null,$=function(i){return document.getElementById(i)};
function log(t){$('out').textContent=t}
function st(t,c){$('st').textContent=t;$('st').className=c||''}
var sc=document.createElement('script');
sc.src='https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.34/dist/iife/trimbleconnect.workspace.api.js';
sc.onerror=function(){st('Could not load the Trimble Connect library.','bad')};
sc.onload=function(){
  window.TrimbleConnectWorkspace.connect(window.parent,function(ev,d){},20000).then(function(a){
    api=a;var p=a.extension.getHost?a.extension.getHost():Promise.resolve({});
    return p.then(function(h){st('Connected. Host: '+((h&&h.name)||'unknown'),'ok');['b1','b2'].forEach(function(b){$(b).disabled=false})});
  }).catch(function(e){st('Not connected: '+(e&&e.message||e),'bad')});
};
document.head.appendChild(sc);
function summarize(objs,label,ms){
  var sets={},n=0,keys={},cls={};
  objs.forEach(function(o){n++;cls[o.class||'?']=(cls[o.class||'?']||0)+1;(o.properties||[]).forEach(function(ps){
    var s=sets[ps.name]=sets[ps.name]||{objects:0,props:{}};s.objects++;
    (ps.properties||[]).forEach(function(pr){s.props[pr.name]=(s.props[pr.name]||0)+1})})});
  var t=label+': '+n+' objects in '+ms+' ms\n\nClasses: '+JSON.stringify(cls)+'\n\nProperty sets found:\n';
  Object.keys(sets).sort().forEach(function(k){t+='  '+k+' ('+sets[k].objects+' objects): '+Object.keys(sets[k].props).join(', ')+'\n'});
  var want=['Weight','Volume','Number of bars in group','Part Mark','Assembly Mark','Is Main Part?','Length','Profile','Material'];
  var all={};Object.keys(sets).forEach(function(k){Object.keys(sets[k].props).forEach(function(p){all[p.toLowerCase()]=1})});
  t+='\nKey properties present?\n';want.forEach(function(w){t+='  '+w+': '+(all[w.toLowerCase()]?'yes':'NO')+'\n'});
  if(objs[0])t+='\nFirst object (raw):\n'+JSON.stringify(objs[0],null,1).slice(0,2500);
  return t;
}
function flatten(res){var a=[];(res||[]).forEach(function(m){(m.objects||[]).forEach(function(o){o.modelId=m.modelId;a.push(o)})});return a}
$('b1').onclick=function(){
  log('Reading selected objects…');var t0=Date.now();
  api.viewer.getObjects({selected:true,output:{loadProperties:true}}).then(function(r){
    last=r;var o=flatten(r);if(!o.length){log('Nothing is selected. Click an object in the 3D view first.');return}
    $('b3').disabled=false;log(summarize(o,'Selected',Date.now()-t0));
  }).catch(function(e){log('Failed: '+(e&&e.message||JSON.stringify(e)))});
};
$('b2').onclick=function(){
  log('Reading ALL objects… (a big model can take a while; please wait)');var t0=Date.now();
  api.viewer.getObjects(undefined,undefined).then(function(r){
    var o=flatten(r);if(o.length&&!(o[0].properties&&o[0].properties.length)){
      log('Got '+o.length+' objects without properties; loading properties…');
      var p=Promise.resolve([]);
      r.forEach(function(m){var ids=(m.objects||[]).map(function(x){return x.id});
        for(var i=0;i<ids.length;i+=500){(function(sl,mid){p=p.then(function(acc){return api.viewer.getObjectProperties(mid,sl).then(function(props){props.forEach(function(x){x.modelId=mid});return acc.concat(props)})})})(ids.slice(i,i+500),m.modelId)}});
      return p.then(function(all){last=all;$('b3').disabled=false;log(summarize(all,'All objects',Date.now()-t0))});
    }
    last=r;$('b3').disabled=false;log(summarize(o,'All objects',Date.now()-t0));
  }).catch(function(e){log('Failed: '+(e&&e.message||JSON.stringify(e)))});
};
$('b3').onclick=function(){
  var b=new Blob([JSON.stringify(last)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='viewer-probe.json';document.body.appendChild(a);a.click();a.remove();
};
</script></body></html>
