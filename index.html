<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body><title>IFC Report Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim top bar, builder rail on the left, live report on the right. Steel-blue neutrals, one blue accent, rust for warnings. */
:root {
  --bg: #f1f4f7; --panel: #ffffff; --panel-2: #f7f9fb; --line: #d5dce3; --line-soft: #e6ebf0;
  --fg: #17212b; --muted: #5a6877; --accent: #0a58a8; --accent-fg: #ffffff; --accent-soft: #e3eefa;
  --warn: #a8480f; --warn-soft: #fbece0; --ok: #1d7a4a; --total: #e8eff7; --sub: #f2f6fa; --focus: #0a58a8;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #1a222a; --panel-2: #151c23; --line: #2f3b47; --line-soft: #26313b;
    --fg: #e5ebf1; --muted: #9aa8b6; --accent: #5ea8f2; --accent-fg: #0b1b2b; --accent-soft: #1c3249;
    --warn: #f0a068; --warn-soft: #3a2616; --ok: #5fcb91; --total: #1f3042; --sub: #1c2733; --focus: #5ea8f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #1a222a; --panel-2: #151c23; --line: #2f3b47; --line-soft: #26313b;
  --fg: #e5ebf1; --muted: #9aa8b6; --accent: #5ea8f2; --accent-fg: #0b1b2b; --accent-soft: #1c3249;
  --warn: #f0a068; --warn-soft: #3a2616; --ok: #5fcb91; --total: #1f3042; --sub: #1c2733; --focus: #5ea8f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.app { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.filechip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12.5px; min-width: 0; }
.filechip b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.filechip span { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 9px 12px; border-radius: 6px; font-size: 13px; background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); }
#banner { display: flex; flex-direction: column; gap: 8px; }
#banner:empty { display: none; }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--fg); }
.banner b { font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 959px) { .main { order: -1; } }
@media (min-width: 960px) { .shell { grid-template-columns: 372px minmax(0, 1fr); } }
.builder { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 14px; min-width: 0; }
.sec { padding: 12px 0; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; }
.sec:last-child { border-bottom: 0; padding-bottom: 0; }
.sec h3 { margin: 0; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec h3 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.row { display: flex; gap: 6px; align-items: center; min-width: 0; }
.row > .muted { white-space: nowrap; }
.row.wrap { flex-wrap: wrap; }
.item { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel-2); min-width: 0; }
.item.missing { border-color: var(--warn); }
select, input[type="text"], input[type="search"], input[type="number"], input.fpick { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px 7px; min-width: 0; max-width: 100%; }
select { flex: 1 1 auto; width: 100%; }
input[type="text"], input[type="search"], input[type="number"] { flex: 1 1 auto; width: 100%; }
.x { flex: 0 0 auto; border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 3px 6px; border-radius: 4px; font-size: 15px; line-height: 1; }
.x:hover { background: var(--line-soft); color: var(--fg); }
.warnline { color: var(--warn); font-size: 12px; }
.muted { color: var(--muted); }
.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.vals { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.vals summary { padding: 5px 8px; cursor: pointer; font-size: 13px; }
.vlist { max-height: 210px; overflow: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line-soft); }
.vlist label { display: flex; gap: 7px; align-items: baseline; font-size: 12.5px; padding: 1px 0; }
.vlist label .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.vlist input[type="search"] { margin: 4px 0; }
.tpl { display: flex; flex-direction: column; gap: 6px; }

/* main */
.main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .title { flex: 1 1 260px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 5px; }
.toolbar .title:hover, .toolbar .title:focus { border-color: var(--line); background: var(--panel); }
.exports { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.meta { color: var(--muted); font-size: 12.5px; }
.status { min-height: 20px; font-size: 13px; color: var(--ok); }
.status.err { color: var(--warn); }
.tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: min(74vh, 900px); }
table.rep { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.rep th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); text-align: left; font-weight: 600; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rep th small { font-weight: 400; color: var(--muted); }
table.rep td { padding: 6px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.rep td.n, table.rep th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.rep tr.sub td { background: var(--sub); font-weight: 500; }
table.rep tr.total td { background: var(--total); font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
table.rep tbody tr:hover td { background: var(--accent-soft); }
table.rep td.g { max-width: 44ch; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

/* fields tab */
.fields td.k { font-family: var(--mono); font-size: 12.5px; white-space: normal; word-break: break-word; min-width: 220px; }
.fields td.k small { display: block; color: var(--muted); font-family: var(--font); font-size: 11.5px; }
.bar { display: inline-block; width: 70px; height: 6px; background: var(--line-soft); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.fields .acts { display: flex; gap: 4px; flex-wrap: nowrap; }
.fields td.ex { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

#tplbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 10px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px; }
#tplbar label { font-size: 12.5px; color: var(--muted); }
#tplbar select { flex: 1 1 240px; width: auto; max-width: 420px; }
#tplbar .tphint { flex: 1 1 100%; font-size: 12px; color: var(--muted); }
.fwrap { flex: 1 1 auto; min-width: 0; }
.fcap { font-size: 11px; color: var(--muted); margin: 2px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#fpop { position: fixed; z-index: 60; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); overflow: auto; font-size: 13px; }
#fpop .fo { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line-soft); }
#fpop .fo.on, #fpop .fo:hover { background: var(--accent-soft); }
#fpop .fn { font-weight: 500; word-break: break-word; }
#fpop .fg { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
#fpop .fm { padding: 6px 10px; color: var(--muted); font-size: 12px; }
.drop { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; border: 3px dashed var(--accent); color: var(--accent); }
.loading { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, transparent); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: border-color .12s; } }
</style>

<div class="app">
  <div class="top">
    <div class="brand">IFC Report Builder <small>Quantity reports from Tekla Structures models. IFC files are read in your browser and never uploaded.</small></div>
    <div class="filechip" id="connectChip" hidden></div>
    <div class="filechip" id="chip" hidden><b id="chipName"></b><span id="chipInfo"></span></div>
    <button class="btn primary" id="viewerBtn" type="button" hidden>Refresh from viewer</button>
    <button class="btn" id="openBtn" type="button">Open IFC file</button>
    <input type="file" id="fileIn" accept=".ifc,.IFC" hidden>
    <div class="seg" role="group" aria-label="Units">
      <button type="button" id="uImp" aria-pressed="true">Imperial</button>
      <button type="button" id="uMet" aria-pressed="false">Metric</button>
    </div>
  </div>
  <div id="fitnote" class="note" hidden></div>
<div id="banner"></div>

  <div class="shell">
    <aside class="builder" id="builder" aria-label="Report settings"></aside>
    <section class="main">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabReport" aria-selected="true">Report</button>
        <button type="button" role="tab" id="tabFields" aria-selected="false">Data fields</button>
      </div>
      <div id="reportPane">
        <div class="toolbar">
          <input class="title" id="title" type="text" aria-label="Report title" placeholder="Report title">
          <div class="exports" id="expbar">
            <button class="btn" type="button" data-exp="copy">Copy table</button>
            <button class="btn needs-dl" type="button" data-exp="csv" hidden>CSV</button>
            <button class="btn needs-dl" type="button" data-exp="txt" hidden>Text</button>
            <button class="btn primary needs-dl" type="button" data-exp="pdf" hidden>PDF</button>
          </div>
        </div>
        <div class="tplbar" id="tplbar"></div>
        <div class="meta" id="meta"></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div id="out"></div>
      </div>
      <div id="fieldsPane" hidden></div>
    </section>
  </div>
</div>
<div class="drop" id="drop" hidden>Drop an IFC file to open it</div>
<div class="loading" id="loading" hidden>Reading model…</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
/* IFC report engine: STEP parser, element table, units, grouping. No DOM use. */
(function (root) {
'use strict';

/* ---------- STEP text helpers ---------- */
function decodeStr(s) {
  return s
    .replace(/\\X2\\([0-9A-Fa-f]+)\\X0\\/g, function (m, h) {
      var o = ''; for (var i = 0; i + 3 < h.length + 0; i += 4) o += String.fromCharCode(parseInt(h.substr(i, 4), 16)); return o;
    })
    .replace(/\\X\\([0-9A-Fa-f]{2})/g, function (m, h) { return String.fromCharCode(parseInt(h, 16)); })
    .replace(/\\S\\(.)/g, function (m, c) { return String.fromCharCode(c.charCodeAt(0) + 128); })
    .replace(/\\\\/g, '\\');
}

/* Index every entity: id -> {type, s, e} (s = '(' offset, e = ';' offset). Geometry is never parsed. */
function scan(text) {
  var ents = new Map();
  var n = text.length;
  var d = text.indexOf('DATA;');
  var re = /#(\d+)\s*=\s*([A-Za-z0-9_]+)\s*\(/g;
  re.lastIndex = d < 0 ? 0 : d;
  var m;
  while ((m = re.exec(text)) !== null) {
    var start = re.lastIndex - 1, p = start, inq = false;
    while (p < n) {
      var c = text.charCodeAt(p);
      if (c === 39) inq = !inq;
      else if (c === 59 && !inq) break;
      p++;
    }
    re.lastIndex = p + 1;
    ents.set(+m[1], { type: m[2].toUpperCase(), s: start, e: p });
  }
  return ents;
}

var RE_NUM = /-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?/y;
var RE_REF = /#(\d+)/y;
var RE_ENUM = /\.([A-Za-z0-9_]+)\./y;
var RE_TYPE = /([A-Za-z][A-Za-z0-9_]*)\s*\(/y;

/* Parse "(a,b,(c))" into JS values. refs -> {r:id}, enums -> {en:'F'}, typed -> {t:'IFCLABEL', v:...}, $ -> null */
function parseArgs(str, from) {
  var i = from || 0;
  function ws() { while (i < str.length) { var c = str.charCodeAt(i); if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break; } }
  function val() {
    ws();
    var c = str[i];
    if (c === '(') {
      i++; var arr = []; ws();
      if (str[i] === ')') { i++; return arr; }
      for (;;) {
        arr.push(val()); ws();
        if (str[i] === ',') { i++; continue; }
        if (str[i] === ')') { i++; return arr; }
        throw new Error('STEP parse error near ' + i);
      }
    }
    if (c === "'") {
      var j = i + 1, k;
      for (;;) { k = str.indexOf("'", j); if (k < 0) throw new Error('unterminated string'); if (str[k + 1] === "'") { j = k + 2; continue; } break; }
      var raw = str.slice(i + 1, k).replace(/''/g, "'"); i = k + 1; return decodeStr(raw);
    }
    if (c === '#') { RE_REF.lastIndex = i; var mr = RE_REF.exec(str); i = RE_REF.lastIndex; return { r: +mr[1] }; }
    if (c === '$') { i++; return null; }
    if (c === '*') { i++; return null; }
    if (c === '.') { RE_ENUM.lastIndex = i; var me = RE_ENUM.exec(str); i = RE_ENUM.lastIndex; return { en: me[1].toUpperCase() }; }
    if (c === '-' || (c >= '0' && c <= '9')) { RE_NUM.lastIndex = i; var mn = RE_NUM.exec(str); i = RE_NUM.lastIndex; return parseFloat(mn[0]); }
    RE_TYPE.lastIndex = i; var mt = RE_TYPE.exec(str);
    if (mt) { i = RE_TYPE.lastIndex - 1; var inner = val(); return { t: mt[1].toUpperCase(), v: inner.length === 1 ? inner[0] : inner }; }
    throw new Error('STEP parse error at ' + i + ': ' + str.slice(i, i + 20));
  }
  return val();
}

/* ---------- Units ---------- */
var PREFIX = { EXA: 1e18, PETA: 1e15, TERA: 1e12, GIGA: 1e9, MEGA: 1e6, KILO: 1e3, HECTO: 1e2, DECA: 10, DECI: 1e-1, CENTI: 1e-2, MILLI: 1e-3, MICRO: 1e-6, NANO: 1e-9 };

/* kind -> {unit key: factor from base SI (m, m2, m3, kg, rad)} */
var UNITS = {
  length: { mm: 1000, m: 1, in: 39.37007874, ft: 3.280839895, ftin: 3.280839895 },
  area: { m2: 1, ft2: 10.76391042, in2: 1550.0031 },
  volume: { m3: 1, ft3: 35.31466672, yd3: 1.307950619 },
  mass: { kg: 1, lb: 2.204622622, t: 0.001, ton: 0.001102311311 }
};
var UNIT_LABEL = { mm: 'mm', m: 'm', in: 'in', ft: 'ft', ftin: 'ft-in', m2: 'm²', ft2: 'ft²', in2: 'in²', m3: 'm³', ft3: 'ft³', yd3: 'yd³', kg: 'kg', lb: 'lb', t: 'tonne', ton: 'US ton' };
var UNIT_DEC = { mm: 0, m: 3, in: 2, ft: 3, ftin: 0, m2: 2, ft2: 1, in2: 0, m3: 3, ft3: 2, yd3: 2, kg: 1, lb: 1, t: 3, ton: 3 };
var DEFAULT_UNIT = {
  metric: { length: 'mm', area: 'm2', volume: 'm3', mass: 'kg' },
  imperial: { length: 'ftin', area: 'ft2', volume: 'yd3', mass: 'lb' }
};

function readUnits(ents, text) {
  var f = { length: 1, area: 1, volume: 1, mass: 1, angle: 1 };
  var names = { LENGTHUNIT: 'length', AREAUNIT: 'area', VOLUMEUNIT: 'volume', MASSUNIT: 'mass', PLANEANGLEUNIT: 'angle' };
  function get(id) { var e = ents.get(id); return e ? parseArgs(text.slice(e.s, e.e)) : null; }
  function factor(id, depth) {
    var e = ents.get(id); if (!e || depth > 5) return 1;
    var a = get(id);
    if (e.type === 'IFCSIUNIT') {
      var pre = a[2] && a[2].en ? (PREFIX[a[2].en] || 1) : 1;
      var base = a[3] && a[3].en === 'GRAM' ? 0.001 : 1;
      return pre * base;
    }
    if (e.type === 'IFCCONVERSIONBASEDUNIT') {
      var mw = get(a[3].r); // IFCMEASUREWITHUNIT(value, unit)
      var v = mw[0] && mw[0].v !== undefined ? mw[0].v : mw[0];
      return v * factor(mw[1].r, depth + 1);
    }
    return 1;
  }
  ents.forEach(function (e, id) {
    if (e.type === 'IFCUNITASSIGNMENT') {
      var a = get(id);
      (a[0] || []).forEach(function (u) {
        var ue = ents.get(u.r); if (!ue) return;
        var ua = get(u.r);
        var kind = ua && ua[1] && ua[1].en && names[ua[1].en];
        if (kind && (ue.type === 'IFCSIUNIT' || ue.type === 'IFCCONVERSIONBASEDUNIT')) f[kind] = factor(u.r, 0);
      });
    }
  });
  return f;
}

/* ---------- Model ---------- */
var MEASURE_KIND = {
  IFCLENGTHMEASURE: 'length', IFCPOSITIVELENGTHMEASURE: 'length', IFCNONNEGATIVELENGTHMEASURE: 'length',
  IFCAREAMEASURE: 'area', IFCVOLUMEMEASURE: 'volume', IFCMASSMEASURE: 'mass', IFCPLANEANGLEMEASURE: 'angle',
  IFCQUANTITYLENGTH: 'length', IFCQUANTITYAREA: 'area', IFCQUANTITYVOLUME: 'volume', IFCQUANTITYWEIGHT: 'mass'
};
var CLASS_NAMES = {
  IFCBEAM: 'IfcBeam', IFCCOLUMN: 'IfcColumn', IFCPLATE: 'IfcPlate', IFCMEMBER: 'IfcMember', IFCFOOTING: 'IfcFooting',
  IFCMECHANICALFASTENER: 'IfcMechanicalFastener', IFCFASTENER: 'IfcFastener', IFCELEMENTASSEMBLY: 'IfcElementAssembly',
